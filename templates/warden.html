<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warden/Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='warden.css') }}">
</head>
<body>
  <header>
    <div class="hostel-select">
      <span class="hostel-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" style="vertical-align: middle">
          <rect x="3" y="7" width="18" height="13" rx="2.5" fill="#a6b7cf" />
          <rect x="7" y="11" width="2" height="3" fill="#6b7a90" />
          <rect x="11" y="11" width="2" height="3" fill="#6b7a90" />
          <rect x="15" y="11" width="2" height="3" fill="#6b7a90" />
          <rect x="7" y="15" width="2" height="3" fill="#6b7a90" />
          <rect x="11" y="15" width="2" height="3" fill="#6b7a90" />
          <rect x="15" y="15" width="2" height="3" fill="#6b7a90" />
          <rect x="9" y="7" width="6" height="2" fill="#6b7a90" />
        </svg>
      </span>
      <span class="hostel-label">NIT RAIPUR: Warden/Admin Panel</span>
    </div>
    <button class="logout-btn">Logout</button>
  </header>

  <div class="dashboard">
    <div class="admin-panel">
      <h1 class="main-title">All Complaints Management</h1>

      <!-- Stats Cards -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-number" id="total-complaints">0</span>
          <span class="stat-label">Total Complaints</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="open-complaints">0</span>
          <span class="stat-label">Open</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="progress-complaints">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="resolved-complaints">0</span>
          <span class="stat-label">Resolved</span>
        </div>
      </div>

      <!-- Complaints Table -->
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Hostel</th>
              <th>Title</th>
              <th>Room</th>
              <th>Description</th>
              <th>Student Details</th>
              <th>Date</th>
              <th>Status</th>
              <th>Image</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-complaints-body"></tbody>
        </table>
        <div id="no-complaints" class="complaints-placeholder" style="display:none">
          No complaints found.
        </div>
        <div id="loading" class="loading">Loading complaints...</div>
      </div>
    </div>
  </div>

  <!-- Custom Alert Modal -->
  <div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <div class="custom-alert-header">
        <span class="custom-alert-icon">
          <svg width="22" height="22" viewBox="0 0 22 22">
            <rect width="22" height="22" rx="4" fill="#21c87a" />
            <path d="M6 11.5L10 15.5L16 7.5"
                  stroke="white" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="custom-alert-title">Status Updated!</span>
        <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
      </div>
      <div class="custom-alert-details" id="customAlertMsg"></div>
    </div>
  </div>

  <script>
    const statusOptions = ["Open", "In Progress", "Resolved", "Closed"];
    let complaints = [];

    // Count-up animation
   // Smooth random count-up effect with slower transition
function animateNumber(id, target) {
  const el = document.getElementById(id);

  let randomPhaseDuration = 900; // total duration in ms (slower random effect)
  let intervalSpeed = 50;        // how quickly numbers change (higher = slower change)

  const randomInterval = setInterval(() => {
    // Show random numbers up to 120 for a more dynamic look
    el.textContent = Math.floor(Math.random() * 120);
  }, intervalSpeed);

  // Stop random phase and show final number
  setTimeout(() => {
    clearInterval(randomInterval);

    // Optional small fade-in transition to actual number
    el.style.transition = "transform 0.2s ease, color 0.3s ease";
    el.style.transform = "scale(1.3)";
    el.style.color = "#00e7df";

    // Snap to real number
    el.textContent = target;

    // Settle back to normal
    setTimeout(() => {
      el.style.transform = "scale(1)";
      el.style.color = "#00cfc8";
    }, 250);
  }, randomPhaseDuration);
}


    function updateStats() {
      const total = complaints.length;
      const open = complaints.filter(c => c.status === "Open").length;
      const prog = complaints.filter(c => c.status === "In Progress").length;
      const resolved = complaints.filter(c => c.status === "Resolved").length;
      animateNumber("total-complaints", total);
      animateNumber("open-complaints", open);
      animateNumber("progress-complaints", prog);
      animateNumber("resolved-complaints", resolved);
    }

    async function fetchComplaints() {
      try {
        document.getElementById("loading").style.display = "block";
        const res = await fetch("/api/complaints", { credentials: "include" });
        if (!res.ok) throw new Error("Failed to fetch");
        complaints = await res.json();
        updateStats();
        renderComplaints();
      } catch (e) {
        alert("Error fetching complaints");
        console.error(e);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function renderComplaints() {
      const tbody = document.getElementById("admin-complaints-body");
      tbody.innerHTML = "";
      const noData = document.getElementById("no-complaints");
      if (!complaints.length) {
        noData.style.display = "block";
        return;
      }
      noData.style.display = "none";

      complaints.forEach((c, i) => {
        const row = document.createElement("tr");
        const statusClass = `status-${(c.status || "Open")
          .toLowerCase().replace(" ", "-")}`;
        row.classList.add("fade-row");
        row.innerHTML = `
          <td>${c.hostel || "N/A"}</td>
          <td>${c.title || "N/A"}</td>
          <td>${c.room || "N/A"}</td>
          <td>${c.text || "No description"}</td>
          <td>
            <div><b>${c.name}</b></div>
            <div>${c.rollno || ""}</div>
            <div>${c.branch || ""}</div>
          </td>
          <td>${c.date || ""}</td>
          <td><span class="status-badge ${statusClass}">${c.status}</span></td>
          <td>
            ${c.image_base64
              ? `<a href="data:image/png;base64,${c.image_base64}" target="_blank">
                  <img src="data:image/png;base64,${c.image_base64}" alt="Evidence"
                  style="max-width:60px; border-radius:6px;" /></a>`
              : "No image"}
          </td>
          <td>
            <select class="status-select" data-id="${c._id}" data-index="${i}">
              ${statusOptions.map(
                s => `<option value="${s}" ${
                  (c.status||"Open")===s?"selected":""}>${s}</option>`
              ).join("")}
            </select>
          </td>`;
        tbody.appendChild(row);
      });

      document.querySelectorAll(".status-select").forEach(sel => {
        sel.addEventListener("change", async function () {
          const id = this.dataset.id;
          const idx = this.dataset.index;
          const newStatus = this.value;
          try {
            const res = await fetch(`/api/complaints/${id}`, {
              method: "PUT",
              credentials: "include",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({ status: newStatus })
            });
            if (!res.ok) throw new Error();
            complaints[idx].status = newStatus;
            updateStats();
            showCustomAlert(`
              <div class="alert-detail-row"><span>Status:</span> <b>${newStatus}</b></div>
              <div class="alert-detail-row"><span>Title:</span> <b>${complaints[idx].title}</b></div>`);
            renderComplaints();
          } catch (e) {
            alert("Failed to update");
            this.value = complaints[idx].status;
          }
        });
      });
    }

    function showCustomAlert(msg) {
      document.getElementById("customAlertMsg").innerHTML = msg;
      document.getElementById("customAlert").classList.add("active");
    }
    function closeCustomAlert() {
      document.getElementById("customAlert").classList.remove("active");
    }

    document.querySelector(".logout-btn").addEventListener("click", async () => {
      const res = await fetch("/logout", { method: "POST", credentials: "include" });
      if (res.ok) window.location.href = "/";
    });

    window.addEventListener("DOMContentLoaded", fetchComplaints);
  </script>
</body>
</html>
